appId: com.sptoys1977.app
productName: SpToys 1977
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!docs/*'
  - '!drizzle/*'
  - '!{electron.vite.config.{js,ts,mjs,cjs},drizzle.config.ts}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!**/node_modules/better-sqlite3/{deps,src,docs}/**'
extraResources:
  - from: drizzle
    to: migrations
asarUnpack:
  - resources/**
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'
win:
  executableName: sptoys1977
  target:
    - nsis
nsis:
  artifactName: sptoys1977-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
  notarize: false
dmg:
  artifactName: sptoys1977-${version}.${ext}
npmRebuild: false
